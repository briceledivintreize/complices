# Blueprint Render : https://render.com/docs/blueprint-spec
# Une seule instance : les parties vivent en mémoire du serveur.
services:
  - type: web
    name: complices
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      # Base Neon pour la banque de questions perso (à remplir dans Render > Environment)
      - key: DATABASE_URL
        sync: false
      # Jeton secret pour relire et valider les questions (généré par Render)
      - key: ADMIN_TOKEN
        generateValue: true
